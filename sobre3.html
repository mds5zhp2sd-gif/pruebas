<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sobre con lazo (vídeo)</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#141f38; font-family: Montserrat, sans-serif; touch-action:none; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #card {
    position:relative; width:min(88vw, 520px); aspect-ratio:9/16; border-radius:4px; overflow:hidden;
    background:#101a31; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
  }
  #card video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; }
  #ui { position:fixed; bottom:24px; left:0; right:0; text-align:center; }
  button { font:500 12px Montserrat, sans-serif; letter-spacing:3px; text-transform:uppercase; padding:13px 28px; border:1px solid #d6b680; background:#fffdf8; color:#2a2a2a; border-radius:40px; cursor:pointer; }
  #hint { margin-top:10px; font-size:11px; color:#c9b68e; letter-spacing:1px; }
</style>
</head>
<body>
<div id="stage">
  <div id="card">
    <!-- lazo_desata.mp4: vídeo grabado del lazo deshaciéndose (mismo encuadre que la portada) -->
    <video id="vid" src="lazo_desata.mp4" muted playsinline preload="auto"></video>
  </div>
</div>
<div id="ui">
  <button id="toggle">Desatar</button>
  <div id="hint">Arrastra hacia abajo para ir deshaciendo el lazo</div>
</div>

<script>
(() => {
  const vid = document.getElementById('vid');
  const btn = document.getElementById('toggle');
  const card = document.getElementById('card');
  let target = 0;          // 0 = atado (frame 0), 1 = desatado (último frame)
  let dragging = false, startY = 0, base = 0, animating = false;

  // Pausamos el vídeo y lo movemos con el dedo: el progreso es la posición en el tiempo
  vid.pause();
  const setProgress = p => {
    if (vid.duration && isFinite(vid.duration)) vid.currentTime = Math.max(0, Math.min(1, p)) * (vid.duration - .04);
  };

  // Botón: reproduce el desatado de forma natural
  function playTo(t) {
    target = t;
    btn.textContent = t ? 'Atar' : 'Desatar';
    animating = true;
    vid.playbackRate = t ? 1 : -1;
  }
  btn.addEventListener('click', () => playTo(target ? 0 : 1));

  // Arrastre: hacia abajo avanza el vídeo; hacia arriba lo rebobina
  card.addEventListener('pointerdown', e => { dragging = true; startY = e.clientY; base = progressNow(); animating = false; });
  addEventListener('pointermove', e => {
    if (!dragging) return;
    const p = Math.max(0, Math.min(1, base + (e.clientY - startY) / 320));
    setProgress(p);
  });
  addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    const p = progressNow();
    target = p > .5 ? 1 : 0;
    btn.textContent = target ? 'Atar' : 'Desatar';
    // Termina el movimiento hasta el estado elegido
    animating = true;
  });

  function progressNow() {
    return vid.duration ? vid.currentTime / (vid.duration - .04) : 0;
  }

  // Animación automática (botón o al soltar): avanza o retrocede el vídeo a velocidad normal
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    if (animating && !dragging && vid.duration) {
      const p = progressNow();
      const step = dt / vid.duration * 1.0;           // tiempo real del vídeo
      if (target === 1 && p < 1) setProgress(Math.min(1, p + step));
      else if (target === 0 && p > 0) setProgress(Math.max(0, p - step));
      else animating = false;
    }
    requestAnimationFrame(frame);
  }
  vid.addEventListener('loadeddata', () => setProgress(0));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
