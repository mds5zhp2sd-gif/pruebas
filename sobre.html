<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sobre con lazo</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#141f38; font-family: Montserrat, sans-serif; touch-action:none; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #card {
    position:absolute; width:min(88vw, 520px); aspect-ratio:1100/1550; top:50%; left:50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(160deg,#1f2d4d,#101a31);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
    border: 1px solid rgba(214,182,128,.35);
    border-radius:4px;
  }
  #bow {
    position:absolute; inset:0; width:100%; height:100%;
    transform-origin: 50% 40%;
    transition: none;
    pointer-events:none;
    filter: drop-shadow(0 10px 12px rgba(0,0,0,.45));
  }
  #ui { position:fixed; bottom:24px; left:0; right:0; text-align:center; }
  button { font:500 12px Montserrat, sans-serif; letter-spacing:3px; text-transform:uppercase; padding:13px 28px; border:1px solid #d6b680; background:#fffdf8; color:#2a2a2a; border-radius:40px; cursor:pointer; }
  #hint { margin-top:10px; font-size:11px; color:#c9b68e; letter-spacing:1px; }
</style>
</head>
<body>
<div id="stage">
  <div id="card">
    <img id="bow" src="lazo_png.png" alt="Lazo de yute con sello">
  </div>
</div>
<div id="ui">
  <button id="toggle">Desatar</button>
  <div id="hint">Arrastra el lazo hacia abajo para desatarlo</div>
</div>

<script>
(() => {
  const bow = document.getElementById('bow');
  const btn = document.getElementById('toggle');
  const PULL = 260;
  let target = 0, progress = 0, pull = null, dragging = false, startY = 0, acc = 0;

  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  function render(p) {
    const e = ease(p);
    // Cae hacia abajo, gira un poco, se encoge en el nudo y se desvanece
    const y = e * 60;               // % del alto de la tarjeta
    const rot = Math.sin(e * Math.PI) * 6 - e * 4;
    const scale = 1 - e * .12;
    bow.style.transform = `translateY(${y}%) rotate(${rot}deg) scale(${scale})`;
    bow.style.opacity = String(Math.max(0, 1 - Math.max(0, (e - .55) / .45)));
  }

  function toggle() {
    target = target ? 0 : 1;
    btn.textContent = target ? 'Atar' : 'Desatar';
  }
  btn.addEventListener('click', toggle);

  const card = document.getElementById('card');
  card.addEventListener('pointerdown', e => { dragging = true; startY = e.clientY; acc = 0; });
  addEventListener('pointermove', e => {
    if (!dragging) return;
    const dy = e.clientY - startY; startY = e.clientY;
    if (dy > 0) { acc = Math.min(PULL, acc + dy); pull = acc / PULL; }
  });
  addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    if (pull !== null) {
      target = pull > .5 ? 1 : 0;
      pull = null;
      btn.textContent = target ? 'Atar' : 'Desatar';
    }
  });

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    if (pull !== null) progress = pull;
    else if (progress < target) progress = Math.min(target, progress + dt / 1.6);
    else if (progress > target) progress = Math.max(target, progress - dt / 1.6);
    render(progress);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
